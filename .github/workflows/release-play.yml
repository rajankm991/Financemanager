name: Release to Google Play

# Builds a signed Android App Bundle (.aab) and, if the Play secrets are set, uploads it to Google Play.
# It never runs by itself: press "Run workflow" on the Actions tab, or push a tag such as v1.0.0.
on:
  workflow_dispatch:
    inputs:
      track:
        description: "Play track to upload to"
        type: choice
        default: internal
        options: [internal, alpha, beta, production]
      status:
        description: "completed = release goes out; draft = you press Release in Play Console (use draft until the app is live)"
        type: choice
        default: draft
        options: [draft, completed]
      version_name:
        description: "Version shown to users (leave blank for 1.<build number>)"
        type: string
        required: false
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      PLAY_SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Check the signing secrets exist
        run: |
          for v in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Secret for $v is missing. See PLAY-STORE-GUIDE.md, step 3."; exit 1; fi
          done

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor
        run: npm install

      - name: Create the Android project
        run: npx cap add android

      - name: Apply app icons
        run: node scripts/apply-icons.js

      - name: Add notification capture (Inbox)
        run: node scripts/apply-notif.js

      - name: Set the version
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ inputs.version_name != '' && inputs.version_name || format('1.{0}', github.run_number) }}
        run: node scripts/set-version.js

      - name: Copy the web app into Android
        run: npx cap sync android

      - name: Show the SDK levels (must be 36)
        run: grep -n "SdkVersion" android/variables.gradle

      - name: Build the app bundle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Sign the bundle with your upload key
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          cp android/app/build/outputs/bundle/release/app-release.aab FinanceLedger.aab
          jarsigner -keystore "$RUNNER_TEMP/upload.jks" -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
            -sigalg SHA256withRSA -digestalg SHA-256 FinanceLedger.aab "$KEY_ALIAS"
          jarsigner -verify FinanceLedger.aab
          rm -f "$RUNNER_TEMP/upload.jks"

      - name: Keep the signed bundle as a download
        uses: actions/upload-artifact@v4
        with:
          name: FinanceLedger-AAB
          path: FinanceLedger.aab

      - name: Read the app id
        id: app
        run: echo "id=$(node -p "require('./capacitor.config.json').appId")" >> "$GITHUB_OUTPUT"

      - name: Upload to Google Play
        if: ${{ env.PLAY_SA != '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ steps.app.outputs.id }}
          releaseFiles: FinanceLedger.aab
          track: ${{ inputs.track || 'internal' }}
          status: ${{ inputs.status || 'draft' }}

      - name: Note when nothing was uploaded
        if: ${{ env.PLAY_SA == '' }}
        run: echo "::notice::No PLAY_SERVICE_ACCOUNT_JSON secret, so the bundle was built but not uploaded. Download FinanceLedger-AAB from this run and upload it by hand (first release)."
