name: Publish web version (GitHub Pages)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stamp the build id
        run: node scripts/stamp-build.js www

      - name: Assemble site
        run: |
          set -e

          if [ -f docs/index.html ]; then
            echo "::warning::docs/index.html is ignored. Site is built from www/."
          fi

          rm -rf _site
          mkdir -p _site

          cp -r www/. _site/

          if [ -f docs/privacy-policy.html ]; then
            cp docs/privacy-policy.html _site/privacy-policy.html
          else
            echo "::warning::docs/privacy-policy.html not found"
          fi

          touch _site/.nojekyll

          # Validate index.html
          test -s _site/index.html || {
            echo "::error::www/index.html is missing or empty"
            exit 1
          }

          grep -q 'function render()' _site/index.html || {
            echo "::error::www/index.html looks damaged"
            exit 1
          }

          echo "Site contents:"
          find _site -maxdepth 2 -type f -print

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
