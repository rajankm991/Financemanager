  if (!res || !res.items.length) return toast('No transactions found. The file needs Date, Details, Debit and Credit columns');
  S.stSeen = S.stSeen || [];
  const seen = new Set(S.stSeen), occ = {}, before = S.pending.slice(); let added = 0, dups = 0, t0 = Date.now();
  res.items.forEach((it, i) => {
    let key = it.date + '|' + it.amount + '|' + it.key;
    if (it.key[0] === 'h'){ occ[key] = (occ[key] || 0) + 1; key += '#' + occ[key]; }      // no reference number: identical rows are counted one by one
    if (seen.has(key)){ dups++; return; }
    seen.add(key); S.stSeen.push(key);
    S.pending.push({id:'p' + t0.toString(36) + i.toString(36) + Math.random().toString(36).slice(2,5), date:it.date, amount:it.amount, merchant:it.merchant, type:it.type, payment:it.payment,
      category:it.category, notes:it.notes, raw:it.raw, app:'Bank statement', src:'stmt', sref:key, dup:stDupNote(it, before), rcvd:new Date(it.date + 'T12:00:00').getTime() + i});
    added++;
  });
  if (S.stSeen.length > 8000) S.stSeen = S.stSeen.slice(-8000);
  save(); render();
  toast(added ? added + ' added to Inbox for approval' + (dups ? ', ' + dups + ' already imported' : '') : 'Nothing new: all ' + dups + ' rows were already imported');
}
async function stFile(f){
  if (!f) return;
  try {
    const nm = f.name.toLowerCase(); let rows = null;
    if (/\.(xlsx|xlsm)$/.test(nm)){
      if (typeof DecompressionStream === 'undefined') return toast('This browser cannot read Excel files. Please update it.');
      const book = await xReadBook(await f.arrayBuffer());
      for (const g of Object.values(book)){ const r = stGridRows(g); if (stParse(r)){ rows = r; break; } }
      if (!rows) return toast('No Date / Details / Debit / Credit columns found in that file');
    } else if (/\.xls$/.test(nm)){
      const buf = await f.arrayBuffer(), txt = new TextDecoder().decode(buf);
      if (!/<table|<html/i.test(txt.slice(0, 3000))) return toast('Old .xls is not supported. Open it in Excel and Save As .xlsx or .csv');
      rows = [...new DOMParser().parseFromString(txt, 'text/html').querySelectorAll('tr')].map(tr => [...tr.children].map(td => td.textContent.trim()));   // some banks save an HTML table as .xls
    } else if (/\.pdf$/.test(nm)) return toast('PDF is not supported. Download the statement as Excel or CSV');
    else rows = stSplit(await f.text());
    stImport(rows);
  } catch(e){ console.error(e); toast('Could not read that file'); }
}
function stPaste(){
  const t = $('st_paste').value.trim();
  if (!t) return toast('Paste the statement rows first');
  stImport(stSplit(t));
}

function pCard(p){
  const cats = catNames(p.type === 'Income' ? 'Income' : 'Expense');
  const when = new Date(p.rcvd).toLocaleString('en-GB', {day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit'});
  const head = p.group ? 'Grouped · ' + p.group.length + ' payments' : p.src === 'stmt' ? 'Bank statement' : esc(p.app || 'Notification') + ' · ' + when;
  const g = (label, inner) => `<div class="pf"><label>${label}</label>${inner}</div>`;
  return `<div class="panel pcard"><div class="ph"><label class="psel"><input type="checkbox" ${(ui.sel || {})[p.id] ? 'checked' : ''} onchange="gTog('${p.id}',this.checked)" aria-label="Select this item"><span>${head}</span></label></div>
    ${p.dup ? `<div class="pdup">⚠ ${esc(p.dup)}</div>` : ''}
    <div class="pgrid">
      ${g('Date', `<input type="date" value="${esc(p.date)}" onchange="pSet('${p.id}','date',this.value)">`)}
      ${g('Amount', `<input type="number" inputmode="decimal" step="any" value="${p.amount}" onchange="pSet('${p.id}','amount',this.value)">`)}
      ${g('Merchant', `<input value="${esc(p.merchant)}" placeholder="Who was it?" onchange="pSet('${p.id}','merchant',this.value.trim())">`)}
      ${g('Type', `<select onchange="pSet('${p.id}','type',this.value)">${opts(['Income','Expense','Investment'], p.type)}</select>`)}
      ${g('Category', `<select onchange="pSet('${p.id}','category',this.value)">${opts(['', ...(p.category && !cats.includes(p.category) ? [p.category] : []), ...cats], p.category)}</select>`)}
      ${g('Payment', `<select onchange="pSet('${p.id}','payment',this.value)">${opts(PAY, p.payment)}</select>`)}
      <div class="pf pwide">${'<label>Description / notes</label>'}<input value="${esc(p.notes)}" placeholder="Add a note (optional)" onchange="pSet('${p.id}','notes',this.value.trim())"></div>
    </div>
    ${p.group ? `<details class="praw" open><summary>${p.group.length} payments inside</summary>${p.group.map(x => `<div class="gl"><span>${esc(x.date)} · ${esc(x.merchant || '—')}${x.notes ? ' · ' + esc(x.notes) : ''}</span><b>${money(x.amount)}</b></div>`).join('')}</details>` : ''}
    ${p.raw ? `<details class="praw"><summary>${p.src === 'stmt' ? 'Original statement text' : 'Original message'}</summary>${esc(p.raw)}</details>` : ''}
    <div class="pacts">${p.group ? B('Ungroup','light',`gUngroup('${p.id}')`) : ''}${B('Reject','danger',`pReject('${p.id}')`)}${B('Approve ✓','',`pApprove('${p.id}')`)}</div></div>`;
}
function vInbox(){
  const list = S.pending.slice().sort((a,b) => b.rcvd - a.rcvd), nSel = gSelected().length;
  return topbar('Inbox', 'Captured from notifications or your bank statement. Nothing counts in your totals until you approve it.') + `
  <div class="panel"><h3><span>🔔</span> Notification capture</h3><div id="niStatus" class="note" style="margin:0">Checking…</div></div>
  <div class="panel"><h3><span>🏦</span> Bank statement <small>missed a notification? add it from the statement</small></h3>
    <p class="note" style="margin:0 0 8px">Upload an Excel (.xlsx) or CSV statement with <b>Date, Details, Debit, Credit</b> columns. Every row comes here for approval with the merchant and description filled in. Rows imported earlier are skipped, and rows that look like an existing entry are marked.</p>
    <input id="stf" type="file" accept=".xlsx,.xlsm,.xls,.csv,.tsv,.txt,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,text/csv" hidden onchange="stFile(this.files[0]);this.value=''">
    <p style="margin:0">${B('⬆ Upload statement','',"$('stf').click()")}</p>
    <details class="praw"><summary>Or paste statement rows (copied from Excel or net banking)</summary>
      <textarea id="st_paste" rows="5" class="ptxt" placeholder="Date  Details  Ref No/Cheque No  Debit  Credit&#10;01/09/2026  WDL TFR UPI/DR/...  2000"></textarea>
      <p style="margin:8px 0 0">${B('Add pasted rows','light','stPaste()')}</p></details></div>
  ${list.length ? `<div class="selrow"><label><input type="checkbox" ${nSel && nSel === list.length ? 'checked' : ''} onchange="gAll(this.checked)"> Select all (${list.length})</label><span>Tick items to group them into one entry, or approve / reject many at once.</span></div>` + list.map(pCard).join('') + '<div style="height:70px"></div>'
    : `<div class="panel"><p class="note" style="margin:0;text-align:center">Nothing waiting. New payments will appear here.</p></div>`}
  <div class="panel"><h3><span>📋</span> Paste a message <small>test the parser, or add one by hand</small></h3>
    <textarea id="p_paste" rows="3" class="ptxt" placeholder="e.g. Rs.450.00 debited from A/c XX1234 on 12-05-24 to VPA swiggy@okhdfcbank"></textarea>
    <p style="margin:8px 0 0">${B('Add to Inbox','','pPaste()')}</p></div>
  <div id="selBar"></div>`;
}

/* ---------- bridge to the Android notification listener (Capacitor plugin 'NotifInbox') ---------- */
const NI = () => { const c = window.Capacitor; if (!(c && c.isNativePlatform && c.isNativePlatform())) return null; try { return NI.p = NI.p || c.registerPlugin('NotifInbox'); } catch(e){ return null; } };
async function drainNative(){
  const p = NI(); if (!p) return;
  try {
    const r = await p.drain(); let n = 0;
    (r.items || []).forEach(i => { if (addPending(i)) n++; });
    if (n) pingInbox(n);
  } catch(e){ /* plugin not installed yet */ }
}
async function niRefresh(){
  const el = $('niStatus'); if (!el) return;
  const p = NI();
  if (!p){ el.innerHTML = 'Automatic capture works only inside the Android app. You can still paste messages below.'; return; }
  try {
    const s = await p.status();
    el.innerHTML = s.enabled
      ? '<span class="pos"><b>On.</b></span> Payment notifications from your bank, UPI and card apps are being collected.'
      : `<span class="neg"><b>Off.</b></span> Allow notification access so the app can see payment alerts. Only alerts from finance apps that mention an amount are kept; everything else is ignored.<p style="margin:8px 0 0">${B('Open notification access','','niOpen()')}</p>`;
  } catch(e){ el.innerHTML = '<b>Lite build:</b> this version has no automatic capture, so Android installs it without the Play Protect block. Paste a payment message below to add it to the Inbox. For automatic capture install the Full build (see the README).'; }
}
const niConsent = () => { try { return localStorage.getItem('rfm_notif_consent') === '1'; } catch(e){ return false; } };
function niGo(){ const p = NI(); if (p) p.openSettings().catch(()=>{}); }
function niOpen(){ if (niConsent()) niGo(); else niDisclosure(); }
function niDisclosure(){
  sheet('Before you allow notification access', `
    <p class="note" style="margin-top:0;color:var(--ink-text);font-size:13px"><b>Finance Ledger can read payment alerts so you do not have to type each one in.</b></p>
    <p class="note" style="font-size:13px"><b>What it reads:</b> the text of notifications from your payment, banking and messaging apps (Google Pay, PhonePe, Paytm, CRED, ICICI iMobile, YONO SBI, BHIM SBI Pay, slice and your SMS app). Only alerts that contain an amount and a payment word are kept. Every other notification is ignored and never saved.</p>
    <p class="note" style="font-size:13px"><b>What it does with it:</b> shows the date, amount and merchant in your Inbox so you can approve or reject each one.</p>
    <p class="note" style="font-size:13px"><b>Where it goes:</b> nowhere. It stays on this phone. It is not uploaded, shared or sold.</p>
    <p class="note" style="font-size:13px">You can switch this off at any time in Android Settings, under Notification access.</p>`,
    B('Not now','light','closeSheet()') + B('I agree, continue','','niAgree()'));
}
function niAgree(){ try { localStorage.setItem('rfm_notif_consent','1'); } catch(e){} closeSheet(); niGo(); }

/* system bar icon colours: light icons on the dark top bar, dark icons on the light page behind the bottom bar */
(function(){ try {
  const sb = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.SystemBars;
  if (sb && isNative()){ sb.setStyle({style:'DARK', bar:'StatusBar'}).catch(()=>{}); sb.setStyle({style:'LIGHT', bar:'NavigationBar'}).catch(()=>{}); }
} catch(e){} })();
if (NI()){
  document.addEventListener('visibilitychange', () => { if (!document.hidden){ drainNative(); if (ui.tab === 'inbox') niRefresh(); } });
  setInterval(() => { if (!document.hidden) drainNative(); }, 8000);
}

const bucket = () => innerWidth >= 1100 ? 2 : innerWidth >= 520 ? 1 : 0; let lastBucket = bucket();
addEventListener('resize', () => { const b = bucket(); if (b !== lastBucket) { lastBucket = b; if (ui.tab==='home') render(); } });
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
window.__appStarted = true;
if (load.dropped) setTimeout(() => toast(load.dropped + ' damaged saved entr' + (load.dropped === 1 ? 'y was' : 'ies were') + ' skipped (a copy is kept)'), 600);
drainNative();
syncInit();
</script>
