/* ---------- Bank statement (Excel / CSV / pasted rows) -> Inbox ---------- */
/* ST-BEGIN */
function stNum(v){ if (typeof v === 'number') return Math.abs(v) || 0; const m = String(v ?? '').replace(/,/g, '').match(/\d+(?:\.\d+)?/); return m ? parseFloat(m[0]) : 0; }
function stDate(v){
  if (typeof v === 'number') return xDateIso(v);
  const s = xTxt(v); let m, d, mo, y;
  if ((m = s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2}|\d{4})\b/))){ d = +m[1]; mo = +m[2]; y = +m[3]; }
  else if ((m = s.match(/^(\d{1,2})[\s\-\/]([A-Za-z]{3})[a-z]*[\s\-\/,]*(\d{2}|\d{4})\b/)) && MON3[m[2].toLowerCase()]){ d = +m[1]; mo = MON3[m[2].toLowerCase()]; y = +m[3]; }
  else if (/^\d{4}-\d{1,2}-\d{1,2}/.test(s)) return xDateIso(s);
  else return null;
  if (y < 100) y += 2000;
  if (d < 1 || d > 31 || mo < 1 || mo > 12) return null;
  return y + '-' + p2(mo) + '-' + p2(d);
}
function stCols(row){            // is this the header row? returns column positions
  const n = row.map(v => typeof v === 'string' ? xNorm(v) : '');
  const find = (re, not) => n.findIndex(x => x && re.test(x) && !(not && not.test(x)));
  let date = find(/date/, /value/); if (date < 0) date = find(/date/);
  const det = find(/detail|descr|narrat|particular|remark/);
  const deb = find(/debit|withdraw|\bdr\b/, /balance/), cre = find(/credit|deposit|\bcr\b/, /balance/);
  if (date < 0 || det < 0 || (deb < 0 && cre < 0)) return null;
  return {date, det, deb, cre, ref: find(/\bref|chq|cheque/)};
}
function stSplit(text){          // tab / comma / semicolon text with quoted multi-line cells
  let t = String(text || '').replace(/^\uFEFF/, '').replace(/([^\n])[ \t]*(?=Date\t+Details\t)/gi, '$1\n');   // a header glued to the end of the previous row
  const smp = t.slice(0, 4000), tabs = (smp.match(/\t/g) || []).length, com = (smp.match(/,/g) || []).length, semi = (smp.match(/;/g) || []).length;
  const d = tabs >= 3 ? '\t' : semi > com ? ';' : ',', rows = []; let row = [], cell = '', q = false;
  const endRow = () => { row.push(cell); cell = ''; if (row.some(x => String(x).trim() !== '')) rows.push(row); row = []; };
  for (let i = 0; i < t.length; i++){
    const c = t[i];
    if (q){ if (c === '"'){ if (t[i+1] === '"'){ cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"' && cell.trim() === ''){ q = true; cell = ''; }
    else if (c === d){ row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r'){ if (c === '\r' && t[i+1] === '\n') i++; endRow(); }
    else cell += c;
  }
  endRow();
  return rows.map(r => r.map(x => String(x).trim()));
}
function stGridRows(grid){
  const out = [];
  for (const r of [...grid.keys()].sort((a, b) => a - b)){ const arr = []; for (const [c, v] of Object.entries(grid.get(r))) arr[+c - 1] = v; out.push(Array.from(arr, v => v === undefined ? '' : v)); }
  return out;
}
const stHash = s => { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36); };
function stNarr(raw){            // bank narration -> merchant, note, payment mode, reference
  let t = String(raw || '').replace(/[\r\n]+/g, '').replace(/\s+/g, ' ').trim();   // the bank wraps long text mid-word, so line breaks are simply removed
  const full = t;
  t = t.replace(/\s+\d{8,}(?:\s+OF\s+.+?)?\s+AT\s+\d+\b.*$/i, '').trim();            // SBI tail: "<acct no> [OF Mr. Name] AT <branch>"
  let merchant = '', note = '', mode = '', ref = '', m;
  if ((m = t.match(/\bUPI\/(?:DR|CR)\/(\d{6,})\/([^\/]*)\/[^\/]*\/([^\/]*)(?:\/(.*))?$/i))){ mode = 'UPI'; ref = m[1]; merchant = m[2]; note = m[4] || ''; }
  else if ((m = t.match(/^UPI[-\/]([^-\/]+)[-\/]([^-\/]*@[^-\/]*)[-\/][^-\/]*[-\/](\d{6,})(?:[-\/](.*))?$/i))){ mode = 'UPI'; merchant = m[1]; ref = m[3]; note = m[4] || ''; }
  else {
    let g = t.replace(/^(?:WDL|DEP)\s+TFR\s+|^(?:BY|TO)\s+TRANSFER\s*[-\/]?\s*|^(?:ATM\s+WDL|CASH\s+(?:WDL|DEP))\s*/i, '');
    mode = /\bUPI\b/i.test(t) ? 'UPI' : /\b(NEFT|IMPS|RTGS|NACH|ECS)\b|\bSBIY|\bINB\b/i.test(t) ? 'Net Banking' : /\bATM\b|\bPOS\b|\bECOM\b|\bDEBIT CARD\b/i.test(t) ? 'Debit Card' : /\bCHQ\b|\bCHEQUE\b|\bCLG\b/i.test(t) ? 'Cheque' : /\bCASH\b/i.test(t) ? 'Cash' : '';
    let tk = g.split('/').map(x => x.trim()).filter(Boolean);
    if (tk.length === 1 && /^(NEFT|IMPS|RTGS)\b/i.test(g)) tk = g.replace(/^(NEFT|IMPS|RTGS)[\s\-]*/i, '').split('-').map(x => x.trim()).filter(Boolean);
    const isRef = x => /^[A-Z0-9\-]{10,}$/i.test(x) && /\d/.test(x);
    tk.forEach(x => { if (!ref && isRef(x)) ref = x; });
    tk = tk.map(x => x.replace(/\s+\d{8,}$/, '')).filter(x => x.length > 1 && !isRef(x) && !/^\d+$/.test(x));
    merchant = tk[0] || ''; note = tk.slice(1).join(' ');
  }
  merchant = merchant.replace(/[^\w&'.\- ]/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 40);
  if (/^(upi|na|nil|ac|a\/c)$/i.test(merchant) || merchant.length < 2) merchant = '';
  if (merchant) merchant = nTitle(merchant);
  note = note.replace(/\s+/g, ' ').trim().slice(0, 80);
  if (/^(upi|na|nil|pay|paym|payment|upi payment|payment from phone|sent using \w+)$/i.test(note)) note = '';
  if (!merchant && note){ merchant = nTitle(note.slice(0, 40)); note = ''; }
  if (!merchant && /\bATM\b/i.test(full)) merchant = 'ATM Withdrawal';
  return {merchant, note, mode, ref, full};
}
function stGuess(text, type){    // keyword -> one of YOUR categories (only if it exists)
  const t = text.toLowerCase(), has = n => catNames(type === 'Income' ? 'Income' : 'Expense').includes(n) ? n : '';
  if (type === 'Income') return /salary|\bsal\b/.test(t) ? has('Salary') : '';
  const rules = [[/college|school|tuition|exam|course|universit|\bfees?\b/, 'Education'], [/swiggy|zomato|restaurant|cafe|food|dominos|pizza|kfc|mcdonald|bakery|sweets/, 'Food & Dining'],
    [/uber|\bola\b|rapido|irctc|fuel|petrol|diesel|metro|fastag|bus\b/, 'Transport'], [/electric|recharge|airtel|\bjio\b|vodafone|bsnl|broadband|dth|water bill|gas/, 'Bills & Utilities'],
    [/amazon|flipkart|myntra|ajio|meesho|mart\b/, 'Shopping'], [/pharma|medical|hospital|clinic|apollo|medplus|doctor/, 'Health'], [/netflix|hotstar|spotify|bookmyshow|prime video/, 'Entertainment'],
    [/\bemi\b|loan/, 'Loan EMI'], [/\bsip\b|mutual|zerodha|groww|insurance|\blic\b|\bppf\b|\bnps\b/, 'Savings & Investments'], [/\brent\b/, 'Rent'], [/hotel|\boyo\b|makemytrip|flight|resort/, 'Travel']];
  for (const [re, c] of rules) if (re.test(t) && has(c)) return c;
  return '';
}
function stParse(rows){
  let hi = -1, col = null;
  for (let i = 0; i < rows.length; i++){ const c = stCols(rows[i]); if (c){ hi = i; col = c; break; } }
  if (hi < 0) return null;
  const items = [];
  for (let i = hi + 1; i < rows.length; i++){
    const r = rows[i]; if (stCols(r)) continue;                  // header repeated on a new page
    const date = stDate(r[col.date]); if (!date) continue;       // "Carry from ...", opening balance, totals
    const dr = col.deb >= 0 ? stNum(r[col.deb]) : 0, cr = col.cre >= 0 ? stNum(r[col.cre]) : 0;
    if (!(dr > 0) && !(cr > 0)) continue;
    const isDr = dr >= cr, amount = isDr ? dr : cr, type = isDr ? 'Expense' : 'Income', n = stNarr(r[col.det]);
    const rc = col.ref >= 0 ? xTxt(r[col.ref]) : '', refCol = /[1-9A-Za-z]/.test(rc) && rc.length >= 5 ? rc : '';
    items.push({date, amount, type, merchant:n.merchant, notes:n.note, payment:n.mode, raw:n.full.slice(0, 400),
      category:nGuessCat(n.merchant, type) || stGuess(n.merchant + ' ' + n.note + ' ' + n.full, type),
      key: n.ref ? 'u:' + n.ref : refCol ? 'r:' + refCol : 'h:' + stHash(n.full)});
  }
  return {items};
}
/* ST-END */
function stDupNote(it, pend){
  const dd = a => Date.UTC(+a.slice(0,4), +a.slice(5,7) - 1, +a.slice(8,10)) / 864e5, same = x => x.type === it.type && Math.abs(x.amount - it.amount) < 0.01 && Math.abs(dd(x.date) - dd(it.date)) <= 1;
  const t = S.transactions.find(same); if (t) return 'Looks like one already in Transactions: ' + (t.description || t.category) + ' on ' + t.date + '. Reject this if it is the same payment.';
  const p = pend.find(same); if (p) return 'Looks like one already in this Inbox: ' + (p.merchant || 'payment') + ' on ' + p.date + '. Reject one of them if it is the same payment.';
  return '';
}
function stImport(rows){
  const res = stParse(rows);
  if (!res || !res.items.length) return toast('No transactions found. The file needs Date, Details, Debit and Credit columns');
  S.stSeen = S.stSeen || [];
  const seen = new Set(S.stSeen), occ = {}, before = S.pending.slice(); let added = 0, dups = 0, t0 = Date.now();
  res.items.forEach((it, i) => {
    let key = it.date + '|' + it.amount + '|' + it.key;
    if (it.key[0] === 'h'){ occ[key] = (occ[key] || 0) + 1; key += '#' + occ[key]; }      // no reference number: identical rows are counted one by one
    if (seen.has(key)){ dups++; return; }
    seen.add(key); S.stSeen.push(key);
    S.pending.push({id:'p' + t0.toString(36) + i.toString(36) + Math.random().toString(36).slice(2,5), date:it.date, amount:it.amount, merchant:it.merchant, type:it.type, payment:it.payment,
      category:it.category, notes:it.notes, raw:it.raw, app:'Bank statement', src:'stmt', sref:key, dup:stDupNote(it, before), rcvd:new Date(it.date + 'T12:00:00').getTime() + i});
    added++;
  });
  if (S.stSeen.length > 8000) S.stSeen = S.stSeen.slice(-8000);

}
async function stFile(f){
  if (!f) return;
  try {
    const nm = f.name.toLowerCase(); let rows = null;
    if (/\.(xlsx|xlsm)$/.test(nm)){
      if (typeof DecompressionStream === 'undefined') return toast('This browser cannot read Excel files. Please update it.');
      const book = await xReadBook(await f.arrayBuffer());
      for (const g of Object.values(book)){ const r = stGridRows(g); if (stParse(r)){ rows = r; break; } }
      if (!rows) return toast('No Date / Details / Debit / Credit columns found in that file');
    } else if (/\.xls$/.test(nm)){
      const buf = await f.arrayBuffer(), txt = new TextDecoder().decode(buf);
      if (!/<table|<html/i.test(txt.slice(0, 3000))) return toast('Old .xls is not supported. Open it in Excel and Save As .xlsx or .csv');

    } else if (/\.pdf$/.test(nm)) return toast('PDF is not supported. Download the statement as Excel or CSV');

    stImport(rows);
  } catch(e){ console.error(e); toast('Could not read that file'); }
}

    <p class="note" style="font-size:13px"><b>What it reads:</b> the text of notifications from your payment, banking and messaging apps (Google Pay, PhonePe, Paytm, CRED, ICICI iMobile, YONO SBI, BHIM SBI Pay, slice and your SMS app). Only alerts that contain an amount and a payment word are kept. Every other notification is ignored and never saved.</p>
    <p class="note" style="font-size:13px"><b>What it does with it:</b> shows the date, amount and merchant in your Inbox so you can approve or reject each one.</p>
    <p class="note" style="font-size:13px"><b>Where it goes:</b> nowhere. It stays on this phone. It is not uploaded, shared or sold.</p>
    <p class="note" style="font-size:13px">You can switch this off at any time in Android Settings, under Notification access.</p>`,
    B('Not now','light','closeSheet()') + B('I agree, continue','','niAgree()'));
}

setInterval(() => { if (!document.hidden){ const n = recurSweep(); if (n) pingInbox(n); } }, 3600e3);
if (NI()){
  document.addEventListener('visibilitychange', () => { if (!document.hidden){ drainNative(); if (ui.tab === 'inbox') niRefresh(); } });

}

addEventListener('resize', () => { const b = bucket(); if (b !== lastBucket) { lastBucket = b; if (ui.tab==='home') render(); } });
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
if (!authGet() && syncOn()) authSet({mode: 'google', email: syncCfg().email || ''});   // people who already had Drive sync on

else if (!authGet().profileDone && S.settings.name) authSet({profileDone: 1});
if (recurSweep()) save();
render();

window.__appStarted = true;
if (load.dropped) setTimeout(() => toast(load.dropped + ' damaged saved entr' + (load.dropped === 1 ? 'y was' : 'ies were') + ' skipped (a copy is kept)'), 600);
